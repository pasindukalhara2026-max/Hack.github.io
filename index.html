<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Hacker Terminal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 🔊 MUSIC -->
<audio id="bgm" loop>
  <source src="bg.mp3" type="audio/mpeg">
</audio>

<!-- 🔥 INTRO -->
<div id="intro">
  <h1>⚠ SYSTEM BOOTING...</h1>
  <p id="introText"></p>
</div>

<canvas id="matrix"></canvas>

<!-- 💀 TERMINAL -->
<div class="terminal">
  <div class="header">🤖 AI HACKING TERMINAL v1.0</div>

  <div id="chat"></div>

  <div class="input-box">
    <input type="text" id="input" placeholder="Type command..." />
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
